name: SportGuard CI/CD Pipeline

on:
  push:
    branches: [ main, master, Bibek-Rout ]
  pull_request:
    branches: [ main, master, Bibek-Rout ]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          SECRET_KEY: "ci_cd_test_secret_key_sportguard_12345"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
        run: |
          cd backend
          pytest tests/ -v -W ignore::DeprecationWarning

  frontend-build:
    name: Frontend Next.js Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Run Next.js Production Build
        working-directory: ./frontend
        run: npm run build
